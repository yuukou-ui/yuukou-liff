<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>開講日 - 優光書道教室</title>
<link rel="icon" href="icon.png">
<!--
  先生の LINE・メールの「開講日をひらく」ボタンから開く画面（2026-11-11）。
  ボタンのアドレスの k（その月だけを開ける鍵）で、Apps Script の schLinkGet / schLinkSave を呼ぶ。
  日をタップ → 開講とお休みが切りかわる。祝日などは「開講にしますか？」。「公開する」で生徒の予約画面に出る。
-->
<style>
  :root {
    --navy: #1a2940; --blue: #2563eb; --bg: #f7f5f1; --card: #ffffff; --ink: #1f2937; --gray: #6b7280; --line: #e7e2d9;
    --open: #dcfce7; --open-ink: #166534; --open-edge: #86efac;
    --closed: #fee2e2; --closed-ink: #b91c1c; --closed-edge: #fecaca;
    --forced: #eef0f3; --forced-ink: #6b7280; --forced-edge: #d6d9de;
    --warn: #fffbeb; --warn-ink: #92400e; --warn-edge: #fde68a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px calc(120px + env(safe-area-inset-bottom)); }
  .hdr { background: linear-gradient(135deg, #1a2940, #2b4a8a); color: #fff; border-radius: 20px; padding: 20px 20px 18px;
    box-shadow: 0 4px 16px rgba(26,41,64,.22); }
  .brand { font-size: 11px; letter-spacing: 3px; opacity: .8; font-weight: 600; }
  .ttl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
  .ttl h1 { font-size: 23px; font-weight: 800; letter-spacing: .5px; }
  .state { font-size: 12px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,.16); white-space: nowrap; }
  .state.pub { background: #22c55e; color: #fff; }

  .counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 16px; }
  .cnt { background: rgba(255,255,255,.1); border-radius: 13px; padding: 8px 0 7px; text-align: center; border: 1.5px solid transparent; transition: background .2s; }
  .cnt b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; }
  .cnt span { font-size: 11px; opacity: .85; font-weight: 700; }
  .cnt.ok { background: rgba(34,197,94,.22); border-color: rgba(134,239,172,.55); }
  .cnt.ng { background: rgba(248,113,113,.28); border-color: rgba(254,202,202,.7); }

  .cal { background: var(--card); border-radius: 20px; margin-top: 14px; padding: 12px 10px 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .dows, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dows div { text-align: center; font-size: 11px; font-weight: 800; color: var(--gray); padding: 2px 0 7px; }
  .dows .sun { color: #dc2626; } .dows .sat { color: #2563eb; }
  .cell { aspect-ratio: 1 / 1.12; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-weight: 800; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; position: relative; }
  .cell .n { font-size: 17px; line-height: 1; }
  .cell .l { font-size: 9.5px; font-weight: 700; line-height: 1.15; text-align: center; padding: 0 2px; max-width: 100%; overflow: hidden; }
  .cell.none { color: #c7c2b8; font-weight: 600; }
  .cell.none .n { font-size: 13px; }
  .cell.tap { cursor: pointer; border: 1.5px solid; transition: transform .08s, background .15s; }
  .cell.tap:active { transform: scale(.93); }
  .cell.open { background: var(--open); color: var(--open-ink); border-color: var(--open-edge); }
  .cell.closed { background: var(--closed); color: var(--closed-ink); border-color: var(--closed-edge); }
  .cell.closed .n { text-decoration: line-through; text-decoration-thickness: 2px; }
  .cell.forced { background: var(--forced); color: var(--forced-ink); border-color: var(--forced-edge); border-style: dashed; }
  .cell.lock { cursor: default; }
  .cell.lock:active { transform: none; }
  .cell.flash { animation: flash .35s ease; }
  @keyframes flash { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .warns { margin-top: 12px; display: none; }
  .warn { background: var(--warn); border: 1px solid var(--warn-edge); color: var(--warn-ink); border-radius: 14px; padding: 11px 14px;
    font-size: 13px; line-height: 1.65; font-weight: 600; }
  .warn + .warn { margin-top: 7px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(247,245,241,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
  .bar-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { border: none; font-family: inherit; font-weight: 800; border-radius: 15px; padding: 16px 12px; font-size: 16px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: opacity .15s, transform .08s; }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .38; cursor: default; transform: none; }
  .btn.sub { flex: 0 0 34%; background: #fff; color: var(--navy); box-shadow: inset 0 0 0 1.5px #d6d2c9; }
  .btn.main { flex: 1; background: var(--navy); color: #fff; box-shadow: 0 4px 14px rgba(26,41,64,.28); }

  .center { text-align: center; padding: 70px 22px; color: var(--gray); font-size: 14px; line-height: 1.8; }
  .spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3.5px solid #e5e1d8; border-top-color: var(--navy); animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .stage { font-size: 11px; color: #a8a29e; margin-top: 6px; }
  .msgcard { background: #fff; border-radius: 20px; padding: 30px 22px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-top: 30px; }
  .msgcard h2 { font-size: 18px; color: var(--navy); margin-bottom: 10px; }
  .msgcard p { font-size: 14px; line-height: 1.8; color: var(--gray); }
  .retry { margin-top: 18px; background: var(--navy); color: #fff; }

  .done-mark { width: 74px; height: 74px; border-radius: 50%; background: #22c55e; color: #fff; font-size: 40px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 6px 20px rgba(34,197,94,.35);
    animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
    animation: up .22s ease; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: 18px; color: var(--navy); line-height: 1.5; }
  .modal p { font-size: 14px; color: var(--gray); line-height: 1.75; margin-top: 8px; }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; }
  .modal .row .btn { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--navy); color: #fff;
    font-size: 13px; font-weight: 700; padding: 11px 18px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center"><div class="spin"></div>読み込み中…<div class="stage" id="stage">1/2 つないでいます</div></div>
</div>
<div class="bar" id="bar" style="display:none">
  <div class="bar-in">
    <button class="btn sub" id="saveBtn" onclick="save(false)" disabled>保存だけ</button>
    <button class="btn main" id="pubBtn" onclick="askPublish()" disabled>公開する</button>
  </div>
</div>
<div class="modal-bg" id="modalBg" onclick="if (event.target === this) closeModal()">
  <div class="modal"><h3 id="mTitle"></h3><p id="mBody"></p>
    <div class="row"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn main" id="mOk"></button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var API_URL = 'https://script.google.com/macros/s/AKfycbzyCJJ3IfXpPluaZ6LQqjeDKlhu0amXLvp8fCv59CxIMMl0ic8SjuqbtIsbhwbZ_6S8/exec';
  var DOW = ['日', '月', '火', '水', '木', '金', '土'];

  // 鍵はアドレスから消して、この画面の中だけで持つ（画面を共有・保存しても鍵が写らないように）
  var k = '';
  try {
    var q = new URLSearchParams(location.search);
    k = q.get('k') || '';
    if (k) { try { sessionStorage.setItem('kaikou_k', k); } catch (e) {} history.replaceState(null, '', location.pathname); }
    else { try { k = sessionStorage.getItem('kaikou_k') || ''; } catch (e) {} }
  } catch (e) {}

  var S = { data: null, days: [], saved: '', busy: false };
  var app = document.getElementById('app');
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function api(action, extra) {
    var body = { action: action, k: k };
    for (var x in (extra || {})) body[x] = extra[x];
    var timer, timeout = new Promise(function (_, rej) { timer = setTimeout(function () { rej(new Error('timeout')); }, 20000); });
    return Promise.race([
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json(); }),
      timeout
    ]).then(function (r) { clearTimeout(timer); if (!r || !r.ok) throw new Error((r && r.error) || 'error'); return r.data; },
            function (e) { clearTimeout(timer); throw e; });
  }

  function showMessage(title, body, retry) {
    $('bar').style.display = 'none';
    app.innerHTML = '<div class="msgcard"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p>' +
      (retry ? '<button class="btn retry" onclick="location.reload()">もう一度ひらく</button>' : '') + '</div>';
  }

  function load() {
    if (!/^[0-9a-f]{64}$/.test(k)) { showMessage('このページは開けません', 'LINE かメールの「開講日をひらく」ボタンから開いてください。'); return; }
    api('schLinkGet').then(function (d) {
      if ($('stage')) $('stage').textContent = '2/2 表示しています';
      if (!d || !d.success) { showMessage('開けませんでした', (d && d.message) || ''); return; }
      S.data = d;
      S.days = d.days.map(function (c) { return { date: c.date, day: c.day, dow: c.dow, isClosed: c.isClosed, isForced: c.isForced, reason: c.reason }; });
      S.saved = snapshot();
      render();
    }).catch(function () {
      showMessage('うまく開けませんでした', '電波のよいところで、もう一度ひらいてください。', true);
    });
  }
  function snapshot() { return S.days.map(function (c) { return c.isClosed ? '1' : '0'; }).join(''); }

  function counts() {
    var n = {};
    S.data.classDows.forEach(function (dw) { n[dw] = 0; });
    S.days.forEach(function (c) { if (!c.isClosed && n.hasOwnProperty(c.dow)) n[c.dow]++; });
    return n;
  }
  function allOk(n) { return S.data.classDows.every(function (dw) { return n[dw] === S.data.required; }); }

  function warnings() {
    var out = [], d = S.data, byDow = {};
    S.days.forEach(function (c) { (byDow[c.dow] = byDow[c.dow] || []).push(c); });
    d.classDows.forEach(function (dw) {
      var a = byDow[dw] || [];
      if (!a.length) return;
      if (d.prevClosedDows.indexOf(dw) >= 0 && a[0].isClosed) out.push(DOW[dw] + '曜：前の月の最後の週と続けて、2週続けてお休みになります（' + a[0].day + '日）');
      for (var i = 1; i < a.length; i++) if (a[i - 1].isClosed && a[i].isClosed) out.push(DOW[dw] + '曜：' + a[i - 1].day + '日と' + a[i].day + '日が、2週続けてお休みです');
      if (d.nextClosedDows.indexOf(dw) >= 0 && a[a.length - 1].isClosed) out.push(DOW[dw] + '曜：' + a[a.length - 1].day + '日と、次の月の第1週（祝日など）が続けてお休みになります');
    });
    return out;
  }

  function render() {
    var d = S.data, n = counts(), ok = allOk(n), locked = d.published;
    var html = '<div class="hdr"><div class="brand">優光書道教室</div>' +
      '<div class="ttl"><h1>' + d.year + '年' + d.month + '月の開講日</h1><span class="state' + (locked ? ' pub' : '') + '">' + (locked ? '公開中' : '下書き') + '</span></div>' +
      '<div class="counts">' + d.classDows.map(function (dw) {
        return '<div class="cnt ' + (n[dw] === d.required ? 'ok' : 'ng') + '"><b>' + n[dw] + '</b><span>' + DOW[dw] + '曜</span></div>';
      }).join('') + '</div></div>';

    // カレンダー（日曜はじまり）
    var first = new Date(d.year, d.month - 1, 1), last = new Date(d.year, d.month, 0).getDate(), byDate = {};
    S.days.forEach(function (c, i) { byDate[c.day] = i; });
    html += '<div class="cal"><div class="dows">' + DOW.map(function (w, i) { return '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>'; }).join('') + '</div><div class="grid">';
    for (var b = 0; b < first.getDay(); b++) html += '<div></div>';
    for (var day = 1; day <= last; day++) {
      if (!byDate.hasOwnProperty(day)) { html += '<div class="cell none"><span class="n">' + day + '</span></div>'; continue; }
      var i = byDate[day], c = S.days[i];
      var cls = c.isForced ? 'forced' : (c.isClosed ? 'closed' : 'open');
      var label = c.isForced ? (c.reason || 'お休み') : (c.isClosed ? '休講' : '開講');
      html += '<div class="cell tap ' + cls + (locked ? ' lock' : '') + '" id="c' + i + '"' + (locked ? '' : ' onclick="tapDay(' + i + ')"') + '>' +
        '<span class="n">' + day + '</span><span class="l">' + esc(label) + '</span></div>';
    }
    html += '</div></div>';

    var w = warnings();
    html += '<div class="warns" style="display:' + (w.length ? 'block' : 'none') + '">' + w.map(function (x) { return '<div class="warn">' + esc(x) + '</div>'; }).join('') + '</div>';
    if (locked) html += '<div class="msgcard" style="margin-top:14px"><p>この月は公開しています。生徒さんの予約画面に出ています。<br>変えるときは管理画面の「開講日設定」から。</p></div>';
    app.innerHTML = html;

    $('bar').style.display = locked ? 'none' : 'block';
    $('saveBtn').disabled = S.busy || snapshot() === S.saved;
    $('pubBtn').disabled = S.busy || !ok;
  }

  window.tapDay = function (i) {
    if (S.busy || S.data.published) return;
    var c = S.days[i];
    if (c.isForced) {
      openModal(S.data.month + '月' + c.day + '日（' + (c.reason || 'お休み') + '）を開講にしますか？', '', '開講にする', function () {
        c.isForced = false; c.isClosed = false; c.reason = null;
        render(); flash(i);
      });
      return;
    }
    c.isClosed = !c.isClosed;
    render(); flash(i);
  };
  function flash(i) { var el = $('c' + i); if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }

  window.save = function (publish) {
    if (S.busy) return;
    S.busy = true; render();
    $(publish ? 'pubBtn' : 'saveBtn').textContent = publish ? '公開しています…' : '保存しています…';
    api('schLinkSave', { days: S.days.map(function (c) { return { date: c.date, isClosed: c.isClosed }; }), publish: !!publish })
      .then(function (r) {
        S.busy = false;
        $('saveBtn').textContent = '保存だけ'; $('pubBtn').textContent = '公開する';
        if (!r || !r.success) { render(); openModal('できませんでした', (r && r.message) || '', 'とじる', null); return; }
        S.saved = snapshot();
        if (publish) { S.data.published = true; done(); return; }
        render(); toast('保存しました（まだ公開していません）');
      })
      .catch(function () {
        S.busy = false;
        $('saveBtn').textContent = '保存だけ'; $('pubBtn').textContent = '公開する';
        render(); openModal('つながりませんでした', '電波のよいところで、もう一度押してください。', 'とじる', null);
      });
  };
  window.askPublish = function () {
    openModal(S.data.year + '年' + S.data.month + '月を公開します', '生徒さんの予約画面に、この月のお稽古日が出ます。', '公開する', function () { save(true); });
  };
  function done() {
    $('bar').style.display = 'none';
    app.innerHTML = '<div class="msgcard" style="margin-top:60px"><div class="done-mark">✓</div><h2>公開しました</h2>' +
      '<p>' + S.data.year + '年' + S.data.month + '月のお稽古日が、生徒さんの予約画面に出ています。この画面は閉じて大丈夫です。</p></div>';
  }

  var onOk = null;
  function openModal(title, body, okLabel, fn) {
    $('mTitle').textContent = title; $('mBody').textContent = body; $('mBody').style.display = body ? 'block' : 'none';
    $('mOk').textContent = okLabel; onOk = fn;
    $('mOk').previousElementSibling.style.display = fn ? '' : 'none';
    $('modalBg').classList.add('show');
  }
  window.closeModal = function () { $('modalBg').classList.remove('show'); onOk = null; };
  $('mOk').onclick = function () { var f = onOk; closeModal(); if (f) f(); };
  var tt;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('show'); }, 2200); }

  load();
})();
</script>
</body>
</html>
